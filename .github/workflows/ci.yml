name: FileConvert CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
      runs-on: ubuntu-latest
      permissions:
            contents: read
      steps:
        - name: Checkout respo
          uses: actions/checkout@v7

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "24"
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm test

        - name: Build docker image
          run: docker build -t fileconvert:ci .
